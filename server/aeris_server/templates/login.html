{% extends "base.html" %}

{% block content %}
<main class="flex-1 flex items-center justify-center p-6">
  <form method="post" action="/login" class="w-full max-w-sm space-y-4">
    <h1 class="text-xl font-semibold">Log in</h1>
    {% if error %}
    <div class="p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded">{{ error }}</div>
    {% endif %}
    <label class="block text-sm">
      Token
      <input type="password" name="token" required autofocus autocomplete="current-password"
             class="mt-1 w-full font-mono text-sm border border-celadon rounded p-2 bg-white focus:outline-none focus:border-midnight-violet">
    </label>
    <button type="submit"
            class="w-full bg-dark-amaranth text-white rounded px-3 py-2 text-sm font-medium hover:opacity-90 transition-opacity">
      Log in
    </button>
  </form>
</main>
{% endblock %}
