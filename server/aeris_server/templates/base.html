<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>æris</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body class="font-sans bg-base-100 text-base-content h-screen flex flex-col overflow-hidden">

  <header class="navbar min-h-0 flex-none bg-base-200 border-b border-base-300 px-4 py-2">
    <span class="flex-1 text-lg font-semibold tracking-tight">æris</span>
    {% if token %}
    <form method="post" action="/logout" class="flex items-center gap-2 text-sm">
      <span class="opacity-60">{{ token.name }}</span>
      <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
    </form>
    {% endif %}
  </header>

  {% block content %}{% endblock %}

</body>
</html>
