<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>æris</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="font-sans bg-white text-midnight-violet h-screen flex flex-col overflow-hidden">

  <header class="flex-none bg-frozen-water border-b border-celadon px-6 py-3 flex items-center justify-between">
    <span class="text-lg font-semibold tracking-tight">æris</span>
    {% if token %}
    <form method="post" action="/logout" class="flex items-center gap-3 text-sm">
      <span class="opacity-50">{{ token.name }}</span>
      <button type="submit" class="hover:underline">Log out</button>
    </form>
    {% endif %}
  </header>

  {% block content %}{% endblock %}

</body>
</html>
