<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>æris</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body class="{% block body_class %}font-sans text-sm bg-base-100 text-base-content h-dvh flex flex-col overflow-hidden{% endblock %}">

  <header class="navbar min-h-0 flex-none gap-2 bg-base-200 border-b border-base-300 px-4 py-2">
    <span class="flex-1 flex items-center gap-1.5 text-lg font-semibold tracking-tight">
      {# The logo: an indigo ring, also the favicon (static/favicon.svg). #}
      <svg class="size-3.5 text-primary" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
      æris
    </span>
    {% if token %}
    <button class="btn btn-primary btn-sm"
            hx-get="/notes/new"
            hx-target="#main-panel">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New note
    </button>
    <form method="post" action="/logout">
      <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
    </form>
    {% endif %}
  </header>

  {% block content %}{% endblock %}

</body>
</html>
