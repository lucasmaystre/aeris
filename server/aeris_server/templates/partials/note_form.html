<div class="p-6 max-w-3xl h-full flex flex-col">

  <h2 class="text-sm font-semibold opacity-60 mb-3">
    {% if note_id %}Edit note #{{ note_id }}{% else %}New note{% endif %}
  </h2>

  {% if error %}
  <div role="alert" class="alert alert-soft {% if conflict %}alert-warning{% else %}alert-error{% endif %} mb-3 text-sm">
    {{ error }}
  </div>
  {% endif %}

  <form class="flex-1 min-h-0 flex flex-col gap-2"
        {% if note_id %}hx-put="/notes/{{ note_id }}"{% else %}hx-post="/notes"{% endif %}
        hx-target="#main-panel"
        hx-swap="innerHTML">
    {% if expected_updated_at %}
    <input type="hidden" name="expected_updated_at" value="{{ expected_updated_at.isoformat() }}">
    {% endif %}
    <textarea name="content"
              placeholder="Write your note here…"
              autofocus
              class="textarea w-full flex-1 min-h-64 font-mono text-sm leading-relaxed resize-none">{{ content }}</textarea>
    <p class="text-xs opacity-60">
      Markdown. Tag a note with a line like <code>Tags: #ideas, #project/aeris</code>.
    </p>
    <div class="flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      {% if note_id %}
      <button type="button"
              class="btn btn-ghost btn-sm"
              hx-get="/notes/{{ note_id }}"
              hx-target="#main-panel"
              hx-swap="innerHTML">
        Cancel
      </button>
      {% endif %}
    </div>
  </form>

</div>
