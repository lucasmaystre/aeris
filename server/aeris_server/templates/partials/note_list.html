<ul id="note-list" class="divide-y divide-base-300 border-b border-base-300">
  {% for note in notes %}
  {% with text = note.content | preview, score = none, searchable = true %}{% include "partials/note_row.html" %}{% endwith %}
  {% else %}
  <li class="px-4 py-3 text-sm opacity-60">No notes yet.</li>
  {% endfor %}
  {% if notes %}
  <li class="no-matches px-4 py-3 text-sm opacity-60" hidden>
    No notes match.<span class="rank-hint"> Press Enter to rank by similarity.</span>
  </li>
  {% endif %}
</ul>
