[project]
name = "aeris-server"
version = "0.1.0"
description = "aeris server: web UI and JSON API."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "markdown2[all]>=2.5.5",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aeris_server"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
