# The workspace root: development tools and shared settings. Not a package itself; the packages are
# `server/` (deployed to Vercel) and `cli/` (published to PyPI as `aeris`).
[project]
name = "aeris-workspace"
version = "0"
requires-python = ">=3.13"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aeris",
    "aeris-server",
    "fastapi[standard]>=0.136.1",  # `fastapi dev`
    "python-dotenv>=1.2.2",
    "pyright>=1.1.402",
    "pytest>=8.4.0",
    "ruff>=0.11.13",
]

[tool.uv.workspace]
members = ["server", "cli"]

[tool.uv.sources]
aeris = { workspace = true }
aeris-server = { workspace = true }

[tool.ruff]
line-length = 100  # Default is 88.

[tool.ruff.format]
line-ending = "lf"  # Default is "auto".

[tool.ruff.lint]
extend-select = ["W", "I"]  # Adds warnings & imports.

[tool.ruff.lint.isort]
known-first-party = ["aeris_cli", "aeris_server"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "cli/tests"]
addopts = "--import-mode=importlib"  # Test files in server/ and cli/ may share names.
markers = ["db: needs the Postgres test database (AERIS_TEST_DATABASE_URL)"]

[tool.pyright]
deprecateTypingAliases = true
reportDuplicateImport = true
reportFunctionMemberAccess = "error"
reportImportCycles = "error"
reportIncompatibleMethodOverride = "error"
reportInvalidStringEscapeSequence = "error"
reportMatchNotExhaustive = "error"
reportMissingImports = "error"
reportPropertyTypeMismatch = "error"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUntypedBaseClass = "error"
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
reportMissingParameterType = true
